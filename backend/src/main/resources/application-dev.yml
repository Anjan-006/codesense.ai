# ═══════════════════════════════════════════════════════════════
# CodeSense AI — Development Configuration
# ═══════════════════════════════════════════════════════════════

spring:
  config:
    activate:
      on-profile: dev

  # ─── H2 (PostgreSQL-compat mode for local dev) ─────────────
  datasource:
    url: jdbc:h2:mem:codesense_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  # ─── JPA ───────────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true

  # ─── H2 Console ────────────────────────────────────────────
  h2:
    console:
      enabled: true
      path: /h2-console

  # ─── Redis (disabled for dev) ──────────────────────────────
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # ─── Mail (Console Logger for Dev) ─────────────────────────
  mail:
    host: localhost
    port: 1025

# ─── Logging ──────────────────────────────────────────────────
logging:
  level:
    com.codesenseai: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
