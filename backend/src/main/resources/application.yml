# ═══════════════════════════════════════════════════════════════
# CodeSense AI — Application Configuration
# ═══════════════════════════════════════════════════════════════

spring:
  application:
    name: codesense-ai

  # ─── DataSource ──────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codesense_db}
    username: ${SPRING_DATASOURCE_USERNAME:codesense}
    password: ${SPRING_DATASOURCE_PASSWORD:codesense_secret}
    driver-class-name: org.postgresql.Driver

  # ─── Redis ──────────────────────────────────────────────
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # ─── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  # ─── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ─── File Upload ───────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # ─── Jackson ───────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ─── Server ───────────────────────────────────────────────────
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ─── JWT Configuration ────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:codesense-ai-super-secret-key-that-is-at-least-256-bits-long-for-hmac-sha}
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-zip-size-mb: 100
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-1.5-flash}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}
    max-tokens: 4096
    temperature: 0.1

# ─── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ─── Logging ──────────────────────────────────────────────────
logging:
  level:
    com.codesenseai: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ─── SpringDoc / Swagger ──────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
